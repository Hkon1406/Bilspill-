
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fri Kjøring</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #91d7ff;
  color: white;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#topbar {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  pointer-events: none;
  z-index: 2;
}

.panel {
  background: rgba(5, 18, 29, .78);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 14px;
  padding: 10px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.18);
}

#speed {
  font-size: 25px;
  font-weight: 800;
}

#speedLabel {
  font-size: 11px;
  opacity: .8;
  letter-spacing: 1px;
}

#help {
  max-width: 185px;
  font-size: 12px;
  line-height: 1.5;
  text-align: right;
}

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 20px;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 3;
  pointer-events: none;
}

.control-group {
  display: flex;
  gap: 12px;
  pointer-events: auto;
}

.control {
  width: 68px;
  height: 68px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 20px;
  background: rgba(5,18,29,.7);
  color: white;
  font-size: 29px;
  font-weight: bold;
  display: grid;
  place-items: center;
  user-select: none;
  touch-action: none;
}

.control:active {
  background: rgba(35,130,220,.9);
  transform: scale(.96);
}

#crash {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.7);
}

#crashBox {
  width: min(360px, 100%);
  text-align: center;
  background: #152434;
  border: 2px solid #ff4545;
  border-radius: 24px;
  padding: 30px 22px;
  box-shadow: 0 15px 60px rgba(0,0,0,.45);
}

#crashBox h1 {
  margin: 0 0 12px;
  font-size: 34px;
}

#crashBox p {
  color: #d6e0e9;
  margin-bottom: 24px;
}

#restart {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  background: #20a05a;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#restart:active {
  transform: scale(.98);
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #91d7ff;
  color: #10283a;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  padding: 20px;
}

@media (max-width: 600px) {
  #topbar {
    top: 9px;
    left: 9px;
    right: 9px;
  }

  .panel {
    padding: 8px 11px;
  }

  #speed {
    font-size: 22px;
  }

  #help {
    max-width: 150px;
    font-size: 10px;
  }

  #controls {
    bottom: 16px;
    padding: 0 14px;
  }

  .control {
    width: 61px;
    height: 61px;
    border-radius: 18px;
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="topbar">
  <div class="panel">
    <div id="speed">0 km/t</div>
    <div id="speedLabel">HASTIGHET</div>
  </div>

  <div class="panel" id="help">
    🚗 Fri kjøring<br>
    Piler / WASD for å styre<br>
    Kjør utenfor veien også!
  </div>
</div>

<div id="controls">
  <div class="control-group">
    <button class="control" id="left" aria-label="Venstre">◀</button>
    <button class="control" id="right" aria-label="Høyre">▶</button>
  </div>

  <div class="control-group">
    <button class="control" id="brake" aria-label="Brems">▼</button>
    <button class="control" id="accelerate" aria-label="Gass">▲</button>
  </div>
</div>

<div id="crash">
  <div id="crashBox">
    <h1>💥 KRASJ!</h1>
    <p>Du traff et tre!</p>
    <button id="restart">🔄 Start på nytt</button>
  </div>
</div>

<div id="loading">Laster Fri Kjøring ...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>

<script>
(() => {
  const gameElement = document.getElementById("game");
  const loadingElement = document.getElementById("loading");

  if (!window.THREE) {
    loadingElement.textContent =
      "Kunne ikke laste spillet. Sjekk internettforbindelsen og prøv igjen.";
    return;
  }

  // SCENE
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x91d7ff);
  scene.fog = new THREE.Fog(0x91d7ff, 65, 190);

  const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    300
  );

  camera.position.set(0, 7, 13);
  camera.lookAt(0, 0, -8);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  gameElement.appendChild(renderer.domElement);

  // LYS
  const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x64734b,
    2
  );
  scene.add(ambientLight);

  const sunlight = new THREE.DirectionalLight(0xffffff, 2.2);
  sunlight.position.set(-20, 35, 15);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(1024, 1024);
  scene.add(sunlight);

  // MATERIALER
  const grassMaterial = new THREE.MeshStandardMaterial({
    color: 0x4b9a43,
    roughness: 1
  });

  const roadMaterial = new THREE.MeshStandardMaterial({
    color: 0x353a40,
    roughness: 0.95
  });

  const lineMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.8
  });

  const darkMaterial = new THREE.MeshStandardMaterial({
    color: 0x20252b,
    roughness: 0.9
  });

  // BAKKE
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    grassMaterial
  );

  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.08;
  ground.receiveShadow = true;
  scene.add(ground);

  // VEI
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(13, 400),
    roadMaterial
  );

  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0, -150);
  road.receiveShadow = true;
  scene.add(road);

  // VEIKANTER
  const edgeMaterial = new THREE.MeshStandardMaterial({
    color: 0xe5e5e5
  });

  for (const x of [-6.55, 6.55]) {
    const edge = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.035, 400),
      edgeMaterial
    );

    edge.position.set(x, 0.025, -150);
    scene.add(edge);
  }

  // MIDTSTREKER
  const roadMarks = [];

  for (let i = 0; i < 35; i++) {
    const mark = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.035, 3.2),
      lineMaterial
    );

    mark.position.set(0, 0.035, -190 + i * 6);
    scene.add(mark);
    roadMarks.push(mark);
  }

  // BIL
  const car = new THREE.Group();
  scene.add(car);

  const bodyMaterial = new THREE.MeshStandardMaterial({
    color: 0xe5232e,
    metalness: 0.35,
    roughness: 0.3
  });

  const glassMaterial = new THREE.MeshStandardMaterial({
    color: 0x172b3a,
    metalness: 0.3,
    roughness: 0.2
  });

  const blackMaterial = new THREE.MeshStandardMaterial({
    color: 0x151515,
    roughness: 0.85
  });

  const headlightMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffd0,
    emissive: 0xffee99,
    emissiveIntensity: 1.3
  });

  const tailMaterial = new THREE.MeshStandardMaterial({
    color: 0xf51e28,
    emissive: 0x9c0010,
    emissiveIntensity: 0.5
  });

  // Nedre karosseri
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.05, 0.58, 4.1),
    bodyMaterial
  );

  body.position.y = 0.7;
  body.castShadow = true;
  car.add(body);

  // Panser
  const hood = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.22, 1.15),
    bodyMaterial
  );

  hood.position.set(0, 0.94, -1.25);
  hood.castShadow = true;
  car.add(hood);

  // Tak
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.48, 0.67, 1.85),
    glassMaterial
  );

  cabin.position.set(0, 1.22, 0.15);
  cabin.castShadow = true;
  car.add(cabin);

  // Takdetalj
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(1.42, 0.12, 1.45),
    bodyMaterial
  );

  roof.position.set(0, 1.59, 0.18);
  car.add(roof);

  // Støtfangere
  for (const z of [-2.08, 2.08]) {
    const bumper = new THREE.Mesh(
      new THREE.BoxGeometry(1.9, 0.22, 0.18),
      blackMaterial
    );

    bumper.position.set(0, 0.48, z);
    car.add(bumper);
  }

  // HJUL
  const wheels = [];

  for (const x of [-1.03, 1.03]) {
    for (const z of [-1.35, 1.35]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.43, 0.28, 20),
        blackMaterial
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.45, z);
      wheel.castShadow = true;
      car.add(wheel);
      wheels.push(wheel);

      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(0.19, 0.19, 0.295, 16),
        new THREE.MeshStandardMaterial({
          color: 0xb8c0c8,
          metalness: 0.7,
          roughness: 0.25
        })
      );

      hub.rotation.z = Math.PI / 2;
      hub.position.set(x * 1.015, 0.45, z);
      car.add(hub);
    }
  }

  // LYS
  for (const x of [-0.67, 0.67]) {
    const headlight = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.16, 0.07),
      headlightMaterial
    );

    headlight.position.set(x, 0.82, -2.09);
    car.add(headlight);

    const taillight = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.16, 0.07),
      tailMaterial
    );

    taillight.position.set(x, 0.82, 2.09);
    car.add(taillight);
  }

  // SPEIL
  for (const x of [-1.1, 1.1]) {
    const mirror = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.18, 0.32),
      bodyMaterial
    );

    mirror.position.set(x, 1.05, -0.48);
    car.add(mirror);
  }

  car.position.set(0, 0, 4);
  car.rotation.y = Math.PI;
  car.traverse(object => {
    if (object.isMesh) object.castShadow = true;
  });

  // TRÆR
  const roadside = [];

  const trunkMaterial = new THREE.MeshStandardMaterial({
    color: 0x76502c,
    roughness: 1
  });

  const leafMaterials = [
    new THREE.MeshStandardMaterial({ color: 0x176b32, roughness: 1 }),
    new THREE.MeshStandardMaterial({ color: 0x23813b, roughness: 1 }),
    new THREE.MeshStandardMaterial({ color: 0x2e9143, roughness: 1 })
  ];

  function createTree() {
    const tree = new THREE.Group();

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.28, 2, 7),
      trunkMaterial
    );

    trunk.position.y = 1;
    trunk.castShadow = true;
    tree.add(trunk);

    for (let i = 0; i < 3; i++) {
      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.05 - i * 0.16, 1.8, 8),
        leafMaterials[Math.floor(Math.random() * leafMaterials.length)]
      );

      leaves.position.y = 2 + i * 0.8;
      leaves.castShadow = true;
      tree.add(leaves);
    }

    tree.userData.radius = 1.05;
    return tree;
  }

  function placeTree(tree, z) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const distance = 8 + Math.random() * 14;

    tree.position.set(side * distance, 0, z);
    tree.scale.setScalar(0.8 + Math.random() * 0.65);
  }

  for (let i = 0; i < 48; i++) {
    const tree = createTree();

    placeTree(tree, -210 + i * 5.2 + Math.random() * 3);
    scene.add(tree);
    roadside.push(tree);
  }

  // BUSKER
  const bushMaterial = new THREE.MeshStandardMaterial({
    color: 0x2f7733,
    roughness: 1
  });

  const bushes = [];

  for (let i = 0; i < 55; i++) {
    const bush = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.55 + Math.random() * 0.5, 0),
      bushMaterial
    );

    const side = Math.random() < 0.5 ? -1 : 1;

    bush.position.set(
      side * (7.5 + Math.random() * 17),
      0.4,
      -200 + i * 4.4
    );

    bush.castShadow = true;
    scene.add(bush);
    bushes.push(bush);
  }

  // SPILLTILSTAND
  let speed = 0;
  let carX = 0;
  let steer = 0;
  let crashed = false;
  let lastTime = 0;

  const maxSpeed = 250;
  const maxX = 25;
  const keys = {};

  function resetKeys() {
    for (const key in keys) {
      keys[key] = false;
    }

    steer = 0;
  }

  function crash() {
    if (crashed) return;

    crashed = true;
    speed = 0;
    resetKeys();

    document.getElementById("crash").style.display = "flex";
  }

  // TASTATUR
  window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if ([
      "arrowleft", "arrowright",
      "arrowup", "arrowdown", " "
    ].includes(key)) {
      event.preventDefault();
    }

    keys[key] = true;
  });

  window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
  });

  window.addEventListener("blur", resetKeys);

  // MOBILKNAPPER
  function bindButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", event => {
      event.preventDefault();

      if (crashed) return;

      keys[key] = true;

      try {
        button.setPointerCapture(event.pointerId);
      } catch (_) {}
    });

    function release(event) {
      event.preventDefault();
      keys[key] = false;
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", () => {
      keys[key] = false;
    });
  }

  bindButton("left", "arrowleft");
  bindButton("right", "arrowright");
  bindButton("accelerate", "arrowup");
  bindButton("brake", "arrowdown");

  document.getElementById("restart").addEventListener("click", () => {
    location.reload();
  });

  // RESPONSIV STØRRELSE
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
  });

  // SPILLOPPDATERING
  function animate(time) {
    requestAnimationFrame(animate);

    const delta = lastTime
      ? Math.min((time - lastTime) / 1000, 0.05)
      : 0.016;

    lastTime = time;

    if (!crashed) {
      const accelerating =
        keys["arrowup"] || keys["w"];

      const braking =
        keys["arrowdown"] || keys["s"];

      const turningLeft =
        keys["arrowleft"] || keys["a"];

      const turningRight =
        keys["arrowright"] || keys["d"];

      if (accelerating) {
        speed += 95 * delta;
      } else {
        speed -= 16 * delta;
      }

      if (braking) {
        speed -= 125 * delta;
      }

      speed = Math.max(0, Math.min(maxSpeed, speed));

      steer = 0;

      if (turningLeft) steer -= 1;
      if (turningRight) steer += 1;

      const steeringStrength = 8 + speed * 0.018;

      carX += steer * steeringStrength * delta;
      carX = Math.max(-maxX, Math.min(maxX, carX));

      // Bilen beveger seg litt i svingene
      car.position.x += (carX - car.position.x) * Math.min(1, delta * 8);
      car.rotation.z = -steer * Math.min(speed / 180, 0.22);
      car.rotation.y = Math.PI - steer * 0.07;

      // Hjulene roterer
      for (const wheel of wheels) {
        wheel.rotation.x += speed * delta * 0.025;
      }

      // FARTEN bestemmer hvor fort omgivelsene flytter seg
      const movement = speed * delta * 0.13;

      for (const mark of roadMarks) {
        mark.position.z += movement;

        if (mark.position.z > 15) {
          mark.position.z -= 210;
        }
      }

      for (const tree of roadside) {
        tree.position.z += movement;

        if (tree.position.z > 16) {
          placeTree(tree, -205 - Math.random() * 35);
        }
      }

      for (const bush of bushes) {
        bush.position.z += movement * 0.96;

        if (bush.position.z > 15) {
          const side = Math.random() < 0.5 ? -1 : 1;

          bush.position.set(
            side * (7.5 + Math.random() * 17),
            0.4,
            -205 - Math.random() * 35
          );
        }
      }

      // KOLLISJON MED TRÆR
      for (const tree of roadside) {
        const dx = tree.position.x - car.position.x;
        const dz = tree.position.z - car.position.z;

        const treeRadius = tree.userData.radius * tree.scale.x;

        if (
          Math.abs(dx) < treeRadius + 1.05 &&
          Math.abs(dz) < treeRadius + 1.8
        ) {
          crash();
          break;
        }
      }

      // Kamera følger bilen mykt
      camera.position.x +=
        (car.position.x * 0.3 - camera.position.x) *
        Math.min(1, delta * 2.5);

      camera.lookAt(car.position.x * 0.15, 0.4, -8);

      document.getElementById("speed").textContent =
        Math.round(speed) + " km/t";
    }

    renderer.render(scene, camera);
  }

  loadingElement.style.display = "none";
  requestAnimationFrame(animate);

})();
</script>

</body>
</html>
