
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fri Kjøring</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ab8cb;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#9ab8cb;color:#fff;font-size:18px;z-index:5}
#hud{position:fixed;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{padding:10px 14px;background:#101820d9;border:1px solid #ffffff35;border-radius:12px;color:white;font-size:14px}
#hint{position:fixed;top:14px;right:14px;background:#101820bd;color:white;padding:10px 13px;border-radius:12px;font-size:12px}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.group{display:flex;gap:12px}
.control{width:66px;height:66px;border-radius:18px;background:#17232bd9;border:1px solid #ffffff55;color:white;font-size:27px;display:grid;place-items:center;touch-action:none;user-select:none;pointer-events:auto}
.control:active{background:#496675}
#message{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#101820d9;color:white;border-radius:12px;padding:10px 14px;font-size:13px;white-space:nowrap}
@media(min-width:800px){.control{width:72px;height:72px}#controls{padding:0 35px}}
</style>
</head>
<body>

<div id="loading">Laster Fri Kjøring …</div>

<div id="hud">
  <div class="pill">🚗 Fri Kjøring</div>
  <div class="pill">Fart: <span id="speed">0</span> km/t</div>
</div>

<div id="hint">WASD / piltaster</div>

<div id="controls">
  <div class="group">
    <div class="control" id="left">←</div>
    <div class="control" id="right">→</div>
  </div>
  <div class="group">
    <div class="control" id="brake">▼</div>
    <div class="control" id="gas">▲</div>
  </div>
</div>

<div id="message">Trykk ▲ eller W for å kjøre</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { Sky } from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/objects/Sky.js';

const loading = document.getElementById('loading');
const speedText = document.getElementById('speed');
const message = document.getElementById('message');

let scene, camera, renderer, car;
let speed = 0, steering = 0;
let distance = 0;
let modelLoaded = false;
const keys = {};
const touch = {left:false,right:false,gas:false,brake:false};
const trees = [];
const roadLength = 12000;

try {
  init();
  animate();
} catch (err) {
  loading.textContent = 'Kunne ikke starte 3D-spillet. Åpne spillet via GitHub Pages.';
  console.error(err);
}

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9c9df);
  scene.fog = new THREE.FogExp2(0xb7cbd2, 0.00019);

  camera = new THREE.PerspectiveCamera(
    62, innerWidth / innerHeight, 0.1, 18000
  );
  camera.position.set(0, 5, 12);

  renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:'high-performance'
  });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  // Naturlig himmel og atmosfærisk lys
  const sky = new Sky();
  sky.scale.setScalar(10000);
  scene.add(sky);
  sky.material.uniforms.turbidity.value = 7;
  sky.material.uniforms.rayleigh.value = 2.2;
  sky.material.uniforms.mieCoefficient.value = 0.004;
  sky.material.uniforms.mieDirectionalG.value = 0.78;

  const sun = new THREE.Vector3();
  sun.setFromSphericalCoords(
    1,
    THREE.MathUtils.degToRad(82),
    THREE.MathUtils.degToRad(205)
  );
  sky.material.uniforms.sunPosition.value.copy(sun);

  scene.add(new THREE.HemisphereLight(0xddeeff,0x566044,2.0));

  const sunlight = new THREE.DirectionalLight(0xffe7c2,3.1);
  sunlight.position.set(-250,400,-150);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(1024,1024);
  sunlight.shadow.camera.left = -90;
  sunlight.shadow.camera.right = 90;
  sunlight.shadow.camera.top = 130;
  sunlight.shadow.camera.bottom = -90;
  sunlight.shadow.normalBias = 0.035;
  scene.add(sunlight);

  makeGround();
  makeRoad();
  makeMountains();
  makeForest();
  makeCar();
  loadRealCar();

  window.addEventListener('resize',resize);
  window.addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  });
  window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  window.addEventListener('blur',()=>{
    for(const k in keys)keys[k]=false;
    for(const k in touch)touch[k]=false;
  });

  bindButton('left','left');
  bindButton('right','right');
  bindButton('gas','gas');
  bindButton('brake','brake');

  loading.style.display='none';
}

function bindButton(id,key){
  const el=document.getElementById(id);
  const down=e=>{e.preventDefault();touch[key]=true};
  const up=e=>{e.preventDefault();touch[key]=false};
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
}

function makeGround(){
  // Ujevnt terreng med små høydeforskjeller
  const geo=new THREE.PlaneGeometry(1800,roadLength,100,220);
  geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position;

  for(let i=0;i<p.count;i++){
    const x=p.getX(i);
    const z=p.getZ(i);
    const hills=
      Math.sin(x*0.013+z*0.001)*2.8+
      Math.sin(x*0.027-z*0.004)*1.3+
      Math.cos(z*0.009+x*0.006)*1.5;
    p.setY(i,hills-1.7);
  }
  geo.computeVertexNormals();

  const grass=new THREE.MeshStandardMaterial({
    color:0x536a3d,roughness:1,metalness:0
  });
  const ground=new THREE.Mesh(geo,grass);
  ground.position.z=-roadLength/2+100;
  ground.receiveShadow=true;
  scene.add(ground);

  // Litt variasjon i bakken med store, naturlige fargefelt
  for(let i=0;i<65;i++){
    const patch=new THREE.Mesh(
      new THREE.CircleGeometry(8+Math.random()*22,18),
      new THREE.MeshStandardMaterial({
        color:[0x617849,0x4e6338,0x718353,0x596b40][i%4],
        roughness:1
      })
    );
    patch.rotation.x=-Math.PI/2;
    patch.position.set((Math.random()-.5)*450,
      -0.7+Math.random()*0.08,
      -Math.random()*roadLength);
    patch.scale.set(1+Math.random()*3,1+Math.random()*2,1);
    scene.add(patch);
  }
}

function makeRoad(){
  // Asfalt med små variasjoner i overflaten
  const canvas=document.createElement('canvas');
  canvas.width=512;canvas.height=512;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#383b3b';
  ctx.fillRect(0,0,512,512);

  for(let i=0;i<18000;i++){
    const v=35+Math.random()*55;
    ctx.fillStyle=`rgba(${v},${v},${v},${Math.random()*.28})`;
    const s=Math.random()*2+0.3;
    ctx.fillRect(Math.random()*512,Math.random()*512,s,s);
  }

  const tex=new THREE.CanvasTexture(canvas);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(2,120);
  tex.colorSpace=THREE.SRGBColorSpace;

  const road=new THREE.Mesh(
    new THREE.PlaneGeometry(13,roadLength),
    new THREE.MeshStandardMaterial({
      map:tex,color:0xb4b4b4,roughness:0.94,metalness:0
    })
  );
  road.rotation.x=-Math.PI/2;
  road.position.set(0,-0.05,-roadLength/2+100);
  road.receiveShadow=true;
  scene.add(road);

  // Slitte asfaltkanter
  for(const x of [-6.5,6.5]){
    const edge=new THREE.Mesh(
      new THREE.BoxGeometry(.16,.035,roadLength),
      new THREE.MeshStandardMaterial({color:0xc8c5b5,roughness:.9})
    );
    edge.position.set(x,-.015,-roadLength/2+100);
    scene.add(edge);
  }

  // Stiplede midtlinjer
  const lineMat=new THREE.MeshStandardMaterial({
    color:0xe8e1c8,roughness:.85
  });
  for(let z=100;z>-roadLength;z-=13){
    const dash=new THREE.Mesh(
      new THREE.BoxGeometry(.13,.025,6),
      lineMat
    );
    dash.position.set(0,.005,z);
    scene.add(dash);
  }
}

function makeMountains(){
  const mats=[
    new THREE.MeshStandardMaterial({color:0x667d7b,roughness:1}),
    new THREE.MeshStandardMaterial({color:0x788b84,roughness:1}),
    new THREE.MeshStandardMaterial({color:0x8a9b94,roughness:1})
  ];

  for(let i=0;i<32;i++){
    const h=80+Math.random()*190;
    const r=70+Math.random()*160;
    const geo=new THREE.ConeGeometry(r,h,7+Math.floor(Math.random()*4));
    const mesh=new THREE.Mesh(geo,mats[i%3]);
    mesh.position.set(
      (Math.random()<.5?-1:1)*(180+Math.random()*600),
      h/2-5,
      -200-Math.random()*roadLength
    );
    mesh.rotation.y=Math.random()*Math.PI;
    mesh.receiveShadow=true;
    scene.add(mesh);
  }
}

function makeForest(){
  const trunkMat=new THREE.MeshStandardMaterial({
    color:0x514334,roughness:1
  });
  const leafMats=[
    new THREE.MeshStandardMaterial({color:0x243e2b,roughness:1}),
    new THREE.MeshStandardMaterial({color:0x315237,roughness:1}),
    new THREE.MeshStandardMaterial({color:0x3e6040,roughness:1})
  ];

  const trunkGeo=new THREE.CylinderGeometry(.17,.3,4.5,7);
  const crownGeo=new THREE.ConeGeometry(2.2,6.5,8);

  for(let i=0;i<380;i++){
    const side=Math.random()<.5?-1:1;
    const x=side*(12+Math.random()*120);
    const z=100-Math.random()*roadLength;
    const scale=.65+Math.random()*1.7;

    const group=new THREE.Group();
    const trunk=new THREE.Mesh(trunkGeo,trunkMat);
    trunk.position.y=2.25;
    trunk.scale.setScalar(scale);
    trunk.castShadow=true;
    group.add(trunk);

    for(let layer=0;layer<3;layer++){
      const crown=new THREE.Mesh(crownGeo,leafMats[Math.floor(Math.random()*leafMats.length)]);
      crown.position.y=(4.3+layer*1.8)*scale;
      crown.scale.set(
        scale*(1-layer*.12),
        scale*(1-layer*.08),
        scale*(1-layer*.12)
      );
      crown.rotation.y=Math.random()*Math.PI;
      crown.castShadow=true;
      group.add(crown);
    }

    group.position.set(x,-1,z);
    group.rotation.y=Math.random()*Math.PI*2;
    scene.add(group);
    trees.push(group);
  }
}

function makeCar(){
  car=new THREE.Group();
  scene.add(car);
  makeFallbackCar();
}

function makeFallbackCar(){
  const bodyMat=new THREE.MeshStandardMaterial({
    color:0xb30e18,metalness:.65,roughness:.28
  });
  const glassMat=new THREE.MeshPhysicalMaterial({
    color:0x17252d,metalness:.25,roughness:.13,
    clearcoat:1,clearcoatRoughness:.1
  });
  const tireMat=new THREE.MeshStandardMaterial({
    color:0x151515,roughness:.95
  });

  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.55,4.1),bodyMat);
  body.position.y=.72;
  body.castShadow=true;
  car.add(body);

  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.75,.23,1.15),bodyMat);
  hood.position.set(0,.98,-1.3);
  car.add(hood);

  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.45,.65,1.8),glassMat);
  cabin.position.set(0,1.17,.15);
  cabin.castShadow=true;
  car.add(cabin);

  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.28,.12,.95),bodyMat);
  roof.position.set(0,1.52,.13);
  car.add(roof);

  for(const x of [-.98,.98]){
    for(const z of [-1.3,1.3]){
      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(.39,.39,.24,20),tireMat
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,.43,z);
      wheel.castShadow=true;
      car.add(wheel);
    }
  }

  const lightMat=new THREE.MeshStandardMaterial({
    color:0xfff0c7,emissive:0xffd98a,emissiveIntensity:1.2
  });
  for(const x of [-.62,.62]){
    const light=new THREE.Mesh(new THREE.BoxGeometry(.38,.15,.07),lightMat);
    light.position.set(x,.83,-2.07);
    car.add(light);
  }

  const tailMat=new THREE.MeshStandardMaterial({
    color:0xff1010,emissive:0x7b0000
  });
  for(const x of [-.62,.62]){
    const light=new THREE.Mesh(new THREE.BoxGeometry(.36,.13,.07),tailMat);
    light.position.set(x,.81,2.07);
    car.add(light);
  }
}

function loadRealCar(){
  const loader=new GLTFLoader();
  loader.load(
    'https://threejs.org/examples/models/gltf/ferrari.glb',
    gltf=>{
      const model=gltf.scene;
      model.scale.setScalar(.8);
      model.rotation.y=Math.PI;
      model.position.y=0;
      model.traverse(obj=>{
        if(obj.isMesh){
          obj.castShadow=true;
          obj.receiveShadow=true;
        }
      });
      car.clear();
      car.add(model);
      modelLoaded=true;
    },
    undefined,
    err=>console.warn('Bilmodellen kunne ikke lastes; reservebilen brukes.',err)
  );
}

let last=performance.now();

function animate(now=performance.now()){
  requestAnimationFrame(animate);
  if(!renderer||!scene)return;

  const dt=Math.min((now-last)/1000,.04);
  last=now;

  const forward=keys['w']||keys['arrowup']||touch.gas;
  const backward=keys['s']||keys['arrowdown']||touch.brake;
  const left=keys['a']||keys['arrowleft']||touch.left;
  const right=keys['d']||keys['arrowright']||touch.right;

  if(forward)speed=Math.min(speed+34*dt,180);
  else speed=Math.max(0,speed-9*dt);

  if(backward)speed=Math.max(0,speed-65*dt);

  const steerInput=(left?-1:0)+(right?1:0);
  steering=THREE.MathUtils.damp(steering,steerInput,5,dt);

  car.position.x+=steering*(speed/180)*19*dt;
  car.position.x=THREE.MathUtils.clamp(car.position.x,-5.1,5.1);
  car.position.z=0;
  car.rotation.y=-steering*.12;

  distance+=speed*dt*.28;

  // Flytt landskapet bakover for å gi følelsen av fremdrift
  for(const tree of trees){
    tree.position.z+=speed*dt*1.15;
    if(tree.position.z>camera.position.z+35){
      tree.position.z=-roadLength+Math.random()*-300;
      tree.position.x=(Math.random()<.5?-1:1)*(12+Math.random()*120);
    }
  }

  // Midtlinjene følger veien rundt
  scene.children.forEach(obj=>{
    if(obj.userData.roadDash){
      obj.position.z+=speed*dt*1.15;
      if(obj.position.z>camera.position.z+20)obj.position.z=-roadLength;
    }
  });

  camera.position.x=THREE.MathUtils.damp(camera.position.x,car.position.x*.7,3,dt);
  camera.position.y=THREE.MathUtils.damp(camera.position.y,5.0,3,dt);
  camera.position.z=12;
  camera.lookAt(car.position.x*.65,1,-13);

  speedText.textContent=Math.round(speed);
  if(speed>2)message.style.opacity='0';
  else message.style.opacity='.9';

  renderer.render(scene,camera);
}

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
}
</script>
</body>
</html>
