<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fri Kjøring</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91b9d1;font-family:Arial,sans-serif}
canvas{display:block}
#game{position:fixed;inset:0}
#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:white;text-shadow:0 2px 5px #000}
.panel{background:#101820c9;border:1px solid #ffffff35;border-radius:13px;padding:10px 14px;backdrop-filter:blur(8px)}
#title{font-size:18px;font-weight:bold}
#speed{font-size:26px;font-weight:bold}
.small{font-size:11px;opacity:.8}
#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 20px;border-radius:12px;background:#101820e8;color:white;text-align:center;max-width:85%;line-height:1.5}
#message.hidden{display:none}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.control-group{display:flex;gap:12px;align-items:flex-end}
.control{pointer-events:auto;width:66px;height:66px;border-radius:18px;border:1px solid #ffffff70;background:#17232bbd;color:white;font-size:27px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0004}
.control:active{background:#ffffff55;transform:scale(.96)}
#gas{height:82px;width:72px;background:#176b42d9}
#brake{height:68px;width:65px;background:#872e2ed9;font-size:14px}
#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:white;font-size:11px;text-shadow:0 2px 4px #000;pointer-events:none}
@media(min-width:800px){#controls{padding:0 40px 12px}.control{width:72px;height:72px}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="panel">
    <div id="title">🚘 Fri Kjøring</div>
    <div class="small">FRI KJØRING</div>
  </div>
  <div class="panel" style="text-align:right">
    <div><span id="speed">0</span> <span style="font-size:12px">km/t</span></div>
    <div class="small">HASTIGHET</div>
  </div>
</div>
<div id="message">Starter 3D-verdenen …</div>
<div id="controls">
  <div class="control-group">
    <button class="control" id="left" aria-label="Venstre">◀</button>
    <button class="control" id="right" aria-label="Høyre">▶</button>
  </div>
  <div class="control-group">
    <button class="control" id="brake">BREMS</button>
    <button class="control" id="gas">▲</button>
  </div>
</div>
<div id="hint">Bruk knappene, eller piltastene og W / S på tastaturet</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { Sky } from "three/addons/objects/Sky.js";
const game = document.getElementById("game");
const message = document.getElementById("message");
const speedText = document.getElementById("speed");
let scene, camera, renderer, car;
let speed = 0;
let steer = 0;
let distance = 0;
let ready = false;
const keys = {left:false,right:false,gas:false,brake:false};
const movingObjects = [];
const wheels = [];
function showMessage(text){
  message.textContent = text;
  message.classList.remove("hidden");
}
function hideMessage(){
  message.classList.add("hidden");
}
function makeCanvasTexture(type){
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext("2d");
  if(type === "road"){
    ctx.fillStyle = "#353837";
    ctx.fillRect(0,0,256,256);
    for(let i=0;i<9000;i++){
      const g = 35 + Math.random()*45;
      ctx.fillStyle = `rgba(${g},${g+2},${g+1},${Math.random()*.45})`;
      ctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1+Math.random()*2);
    }
  }else{
    ctx.fillStyle = "#496844";
    ctx.fillRect(0,0,256,256);
    for(let i=0;i<12000;i++){
      const v = Math.random();
      ctx.fillStyle = v>.5
        ? `rgba(115,139,78,${Math.random()*.55})`
        : `rgba(23,60,33,${Math.random()*.55})`;
      ctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*4,1+Math.random()*4);
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
function addBox(parent, size, pos, material, rotY=0){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(size[0],size[1],size[2]),
    material
  );
  mesh.position.set(pos[0],pos[1],pos[2]);
  mesh.rotation.y = rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function createFallbackCar(){
  const group = new THREE.Group();
  const red = new THREE.MeshPhysicalMaterial({
    color:0xb20d17, metalness:.72, roughness:.24, clearcoat:1, clearcoatRoughness:.12
  });
  const glass = new THREE.MeshPhysicalMaterial({
    color:0x172a35, metalness:.25, roughness:.12, transmission:.05
  });
  const rubber = new THREE.MeshStandardMaterial({color:0x111214,roughness:.86});
  const rim = new THREE.MeshStandardMaterial({color:0xb6bdc4,metalness:.85,roughness:.24});
  const lamp = new THREE.MeshStandardMaterial({
    color:0xffffff, emissive:0xffffff, emissiveIntensity:1.5
  });
  addBox(group,[1.9,.42,4.2],[0,.63,0],red);
  addBox(group,[1.65,.32,1.35],[0,.95,-.45],red);
  addBox(group,[1.38,.65,1.45],[0,1.16,-.35],glass);
  addBox(group,[1.9,.16,1.0],[0,.58,-1.55],red);
  addBox(group,[1.8,.12,.45],[0,.83,1.92],red);
  for(const x of [-1,1]){
    for(const z of [-1.35,1.35]){
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.24,24),rubber);
      tire.rotation.z = Math.PI/2;
      tire.position.set(x*.98,.4,z);
      tire.castShadow = true;
      group.add(tire);
      const wheelRim = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.255,20),rim);
      wheelRim.rotation.z = Math.PI/2;
      wheelRim.position.copy(tire.position);
      group.add(wheelRim);
      wheels.push(tire);
    }
  }
  for(const x of [-.65,.65]){
    const headlight = new THREE.Mesh(new THREE.BoxGeometry(.38,.12,.05),lamp);
    headlight.position.set(x,.72,-2.12);
    group.add(headlight);
  }
  return group;
}
function createTree(){
  const tree = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({color:0x55412d,roughness:1});
  const leaves = [
    new THREE.MeshStandardMaterial({color:0x183e29,roughness:1}),
    new THREE.MeshStandardMaterial({color:0x245334,roughness:1}),
    new THREE.MeshStandardMaterial({color:0x315e39,roughness:1})
  ];
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,2.2,7),trunkMat);
  trunk.position.y=1.1;
  trunk.castShadow=true;
  tree.add(trunk);
  for(let i=0;i<4;i++){
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(1.0-i*.15,2.4,8),
      leaves[Math.floor(Math.random()*leaves.length)]
    );
    cone.position.y=2.1+i*.7;
    cone.castShadow=true;
    tree.add(cone);
  }
  const s=.8+Math.random()*.9;
  tree.scale.set(s,s,s);
  return tree;
}
function createRock(){
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(.5+Math.random()*.7,0),
    new THREE.MeshStandardMaterial({color:0x77796f,roughness:1})
  );
  rock.position.y=.25;
  rock.scale.y=.65;
  rock.castShadow=true;
  return rock;
}
function init(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xb6cbd0,.0018);
  camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1600);
  camera.position.set(0,4.2,9.5);
  renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  game.appendChild(renderer.domElement);
  const sky = new Sky();
  sky.scale.setScalar(10000);
  scene.add(sky);
  const sun = new THREE.Vector3();
  const phi = THREE.MathUtils.degToRad(88-(30));
  const theta = THREE.MathUtils.degToRad(180);
  sun.setFromSphericalCoords(1,phi,theta);
  sky.material.uniforms.sunPosition.value.copy(sun);
  scene.add(new THREE.HemisphereLight(0xd9eaff,0x3b4931,2.0));
  const sunlight = new THREE.DirectionalLight(0xfff0d7,3.2);
  sunlight.position.set(-70,120,35);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(1024,1024);
  sunlight.shadow.camera.left=-45;
  sunlight.shadow.camera.right=45;
  sunlight.shadow.camera.top=60;
  sunlight.shadow.camera.bottom=-40;
  scene.add(sunlight);
  const grassTexture = makeCanvasTexture("grass");
  grassTexture.repeat.set(80,240);
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(700,2400),
    new THREE.MeshStandardMaterial({map:grassTexture,roughness:1})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.set(0,-.12,-950);
  ground.receiveShadow=true;
  scene.add(ground);
  const roadTexture = makeCanvasTexture("road");
  roadTexture.repeat.set(1,180);
  const roadMat = new THREE.MeshStandardMaterial({
    map:roadTexture,roughness:.94,metalness:.02
  });
  const road = new THREE.Mesh(new THREE.PlaneGeometry(12,2200),roadMat);
  road.rotation.x=-Math.PI/2;
  road.position.set(0,0,-900);
  road.receiveShadow=true;
  scene.add(road);
  const edgeMat = new THREE.MeshStandardMaterial({color:0xe3dfd0,roughness:.8});
  const lineMat = new THREE.MeshStandardMaterial({color:0xf5f1df,roughness:.7});
  for(const x of [-5.75,5.75]){
    const edge = new THREE.Mesh(new THREE.BoxGeometry(.12,.025,2200),edgeMat);
    edge.position.set(x,.025,-900);
    scene.add(edge);
  }
  for(let z=-12;z>-2100;z-=12){
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(.13,.025,5.5),lineMat);
    stripe.position.set(0,.03,z);
    scene.add(stripe);
    movingObjects.push(stripe);
  }
  // Guardrails, posts, trees and rocks along both sides.
  const railMat = new THREE.MeshStandardMaterial({color:0x8d989a,metalness:.7,roughness:.36});
  const postMat = new THREE.MeshStandardMaterial({color:0x777f80,metalness:.55,roughness:.5});
  for(let z=-18;z>-2000;z-=16){
    for(const side of [-1,1]){
      const post = new THREE.Mesh(new THREE.BoxGeometry(.09,.65,.09),postMat);
      post.position.set(side*7,.32,z);
      scene.add(post);
      movingObjects.push(post);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(.13,.16,16),railMat);
      rail.position.set(side*7,.65,z-8);
      scene.add(rail);
      movingObjects.push(rail);
    }
  }
  for(let z=-15;z>-2000;z-=8){
    for(const side of [-1,1]){
      const tree = createTree();
      tree.position.set(side*(11+Math.random()*24),0,z-Math.random()*6);
      scene.add(tree);
      movingObjects.push(tree);
    }
  }
  for(let z=-10;z>-1800;z-=17){
    for(const side of [-1,1]){
      const rock=createRock();
      rock.position.set(side*(7.8+Math.random()*3),0,z-Math.random()*5);
      scene.add(rock);
      movingObjects.push(rock);
    }
  }
  car = new THREE.Group();
  scene.add(car);
  car.position.set(0,0,1.3);
  // Load a real 3D Ferrari model; keep a backup car if the download fails.
  const loader = new GLTFLoader();
  loader.load(
    "https://threejs.org/examples/models/gltf/ferrari.glb",
    (gltf)=>{
      if(car.userData.modelLoaded) return;
      const model = gltf.scene;
      model.scale.setScalar(.8);
      model.rotation.y=Math.PI;
      model.position.y=.03;
      model.traverse(obj=>{
        if(obj.isMesh){
          obj.castShadow=true;
          obj.receiveShadow=true;
          if(obj.material){
            obj.material.envMapIntensity=1.1;
          }
        }
      });
      car.clear();
      car.add(model);
      car.userData.modelLoaded=true;
    },
    undefined,
    ()=>{
      if(!car.userData.modelLoaded){
        car.add(createFallbackCar());
      }
    }
  );
  // A fallback appears immediately, then is replaced by the 3D model.
  car.add(createFallbackCar());
  ready=true;
  hideMessage();
  animate();
}
let lastTime=performance.now();
function animate(now=performance.now()){
  if(!ready || !renderer) return;
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastTime)/1000,.04);
  lastTime=now;
  const accelerating=keys.gas;
  const braking=keys.brake;
  if(accelerating) speed+=42*dt;
  else speed-=9*dt;
  if(braking) speed-=70*dt;
  speed=THREE.MathUtils.clamp(speed,0,190);
  const targetSteer=(keys.left?-1:0)+(keys.right?1:0);
  steer=THREE.MathUtils.lerp(steer,targetSteer,Math.min(1,dt*5));
  const kmhFactor=speed/190;
  car.position.x+=steer*dt*(2.5+kmhFactor*7);
  car.position.x=THREE.MathUtils.clamp(car.position.x,-5.2,5.2);
  car.rotation.y=THREE.MathUtils.lerp(car.rotation.y,-steer*.09,dt*3);
  const travel=speed*dt*.34;
  distance+=travel;
  for(const obj of movingObjects){
    obj.position.z+=travel;
    if(obj.position.z>15) obj.position.z-=2100;
  }
  // Camera follows the car smoothly.
  camera.position.x=THREE.MathUtils.lerp(camera.position.x,car.position.x*.72,dt*3);
  camera.position.y=THREE.MathUtils.lerp(camera.position.y,4.0+kmhFactor*.45,dt*2);
  camera.lookAt(car.position.x*.55,1.0,-9);
  speedText.textContent=Math.round(speed);
  renderer.render(scene,camera);
}
function setKey(key,value){keys[key]=value}
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") setKey("left",true);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") setKey("right",true);
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w") setKey("gas",true);
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s"||e.key===" ") setKey("brake",true);
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") setKey("left",false);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") setKey("right",false);
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w") setKey("gas",false);
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s"||e.key===" ") setKey("brake",false);
});
function bindButton(id,key){
  const el=document.getElementById(id);
  const down=e=>{e.preventDefault();keys[key]=true};
  const up=e=>{e.preventDefault();keys[key]=false};
  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
bindButton("left","left");
bindButton("right","right");
bindButton("gas","gas");
bindButton("brake","brake");
window.addEventListener("resize",()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
window.addEventListener("error",e=>{
  showMessage("Noe gikk galt ved oppstart. Last siden på nytt og kontroller at internett er tilkoblet.");
});
window.addEventListener("unhandledrejection",()=>{
  showMessage("En 3D-ressurs kunne ikke lastes. Sjekk internett og last siden på nytt.");
});
try{
  init();
}catch(error){
  console.error(error);
  showMessage("3D-grafikken kunne ikke starte på denne enheten. Prøv å laste siden på nytt.");
}
</script>
</body>
</html>
