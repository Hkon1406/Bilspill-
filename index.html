
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fri Kjøring</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#8dd7ff;color:white}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.panel{background:rgba(8,24,40,.82);padding:12px 16px;border:1px solid #ffffff30;border-radius:15px;box-shadow:0 5px 18px #0003;backdrop-filter:blur(8px)}
#speed{font-size:27px;font-weight:800}
.small{font-size:12px;color:#c5dfef;margin-top:3px}
#message{position:fixed;top:100px;left:10px;right:10px;text-align:center;color:white;text-shadow:0 2px 5px #123;font-weight:bold;pointer-events:none}
#controls{position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;align-items:end;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
.control{width:68px;height:68px;border:2px solid #ffffff90;border-radius:20px;background:#102338b9;color:white;font-size:27px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 5px 12px #0003}
.control:active{background:#2678a8;transform:scale(.96)}
#gas{height:82px;background:#188c53df}
#brake{background:#a83d42df}
#help{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:white;text-shadow:0 1px 4px #000;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#102338;color:white;font-size:20px;z-index:5}
@media(max-width:600px){
 .panel{padding:10px 12px}
 #speed{font-size:23px}
 .control{width:61px;height:61px;border-radius:17px}
 #gas{height:75px}
 #controls{padding:0 14px;bottom:28px}
 .group{gap:8px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">🏎️ Starter motoren …</div>

<div id="hud">
  <div class="panel">
    <div style="font-weight:bold">🏁 FRI KJØRING</div>
    <div class="small">3D KJØRESPILL</div>
  </div>
  <div class="panel">
    <div id="speed">0 km/t</div>
    <div class="small">HASTIGHET</div>
  </div>
</div>

<div id="message">Trykk på gassen for å kjøre!</div>

<div id="controls">
  <div class="group">
    <button class="control" id="left" aria-label="Sving venstre">◀</button>
    <button class="control" id="right" aria-label="Sving høyre">▶</button>
  </div>
  <div class="group">
    <button class="control" id="brake" aria-label="Brems">▼</button>
    <button class="control" id="gas" aria-label="Gass">▲</button>
  </div>
</div>
<div id="help">Mobil: hold inne knappene · PC: piltaster eller WASD</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const loading=document.getElementById('loading');
if(!window.THREE){
 loading.textContent='Kunne ikke laste 3D-motoren. Sjekk internett og prøv igjen.';
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d9ff);
scene.fog=new THREE.Fog(0x91d9ff,100,370);

const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,800);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe4f5ff,0x637448,2.1));

const sun=new THREE.DirectionalLight(0xfff5dd,2.6);
sun.position.set(-35,55,20);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-35;
sun.shadow.camera.right=35;
sun.shadow.camera.top=35;
sun.shadow.camera.bottom=-35;
scene.add(sun);

const mat=(color,roughness=.8,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const grass=mat(0x67b64e);
const roadMat=mat(0x343941,.96);
const white=mat(0xf3f3ed,.7);
const dark=mat(0x171c23,.9);
const rubber=mat(0x15171a,1);
const glass=mat(0x79b9d2,.23,.15);
const red=mat(0xd8202e,.3,.15);
const redDark=mat(0x991622,.38,.1);
const chrome=mat(0xb8c5ce,.25,.7);
const lampMat=new THREE.MeshStandardMaterial({
 color:0xfff1b4,emissive:0xffcf69,emissiveIntensity:.45
});
const tailMat=new THREE.MeshStandardMaterial({
 color:0xf51e28,emissive:0x9c0010,emissiveIntensity:.4
});

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.13;
ground.receiveShadow=true;
scene.add(ground);

// Distant hills and mountains
const hillMat=mat(0x80b66b);
const mountainMat=mat(0x7b9c91);
for(let i=0;i<22;i++){
 const angle=(i/22)*Math.PI*2;
 const radius=145+Math.random()*55;
 const h=10+Math.random()*24;
 const hill=new THREE.Mesh(
  new THREE.ConeGeometry(18+Math.random()*18,h,7), 
  i%3===0?mountainMat:hillMat
 );
 hill.position.set(Math.sin(angle)*radius,h/2-2,-65+Math.cos(angle)*radius);
 hill.rotation.y=Math.random()*Math.PI;
 scene.add(hill);
}

// Soft clouds
const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.78});
for(let i=0;i<16;i++){
 const cloud=new THREE.Group();
 const x=-100+Math.random()*200;
 const z=-70-Math.random()*260;
 for(let j=0;j<4;j++){
  const puff=new THREE.Mesh(
   new THREE.SphereGeometry(2.5+Math.random()*2,10,8),cloudMat
  );
  puff.position.set(j*3.1,Math.random()*1.2,Math.random()*2);
  cloud.add(puff);
 }
 cloud.position.set(x,27+Math.random()*14,z);
 scene.add(cloud);
}

// Endless road: each segment recycles smoothly
const roadGroup=new THREE.Group();
scene.add(roadGroup);
const roadWidth=13;
const segmentLength=40;
const segmentCount=18;
const totalRoadLength=segmentLength*segmentCount;
const roadSegments=[];

function makeRoadSegment(index){
 const group=new THREE.Group();
 const centerZ=-index*segmentLength-segmentLength/2;

 const asphalt=new THREE.Mesh(
  new THREE.BoxGeometry(roadWidth,.12,segmentLength),roadMat
 );
 asphalt.position.set(0,0,0);
 asphalt.receiveShadow=true;
 group.add(asphalt);

 // White edge lines
 for(const x of [-roadWidth/2+.12,roadWidth/2-.12]){
  const edge=new THREE.Mesh(
   new THREE.BoxGeometry(.16,.035,segmentLength),white
  );
  edge.position.set(x,.075,0);
  group.add(edge);
 }

 // Continuous dashed centre markings across segments
 for(let z=-segmentLength/2+3;z<segmentLength/2;z+=10){
  const dash=new THREE.Mesh(
   new THREE.BoxGeometry(.17,.04,4.4),white
  );
  dash.position.set(0,.085,z);
  group.add(dash);
 }

 group.position.z=centerZ;
 roadGroup.add(group);
 roadSegments.push(group);
}
for(let i=0;i<segmentCount;i++)makeRoadSegment(i);

// Roadside gravel strips
const shoulderMat=mat(0x999c8b);
for(let i=0;i<segmentCount;i++){
 const z=-i*segmentLength-segmentLength/2;
 for(const side of [-1,1]){
  const shoulder=new THREE.Mesh(
   new THREE.BoxGeometry(.75,.08,segmentLength),shoulderMat
  );
  shoulder.position.set(side*(roadWidth/2+.4),-.01,z);
  roadGroup.add(shoulder);
 }
}

// Trees with layered branches
const trees=[];
const trunkMat=mat(0x765039);
const treeMats=[mat(0x236c37),mat(0x2f8241),mat(0x347c3a)];

function makeTree(x,z,scale=1){
 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.22,1.45,8),trunkMat
 );
 trunk.position.y=.72;
 trunk.castShadow=true;
 g.add(trunk);

 for(let i=0;i<3;i++){
  const crown=new THREE.Mesh(
   new THREE.ConeGeometry(1.15-i*.2,1.9,8),
   treeMats[i]
  );
  crown.position.y=1.65+i*.78;
  crown.castShadow=true;
  g.add(crown);
 }
 g.scale.setScalar(scale);
 g.position.set(x,0,z);
 scene.add(g);
 trees.push(g);
}

for(let z=-12;z>-totalRoadLength;z-=13){
 makeTree(-9-Math.random()*15,z-Math.random()*8,.75+Math.random()*.7);
 makeTree(9+Math.random()*15,z-Math.random()*8,.75+Math.random()*.7);
}

// Small roadside rocks and shrubs
const shrubMat=mat(0x3f8b42);
for(let i=0;i<100;i++){
 const side=Math.random()<.5?-1:1;
 const shrub=new THREE.Mesh(
  new THREE.DodecahedronGeometry(.35+Math.random()*.45,0),shrubMat
 );
 shrub.position.set(side*(8+Math.random()*18),.2,-Math.random()*totalRoadLength);
 scene.add(shrub);
 trees.push(shrub);
}

// Detailed car
const car=new THREE.Group();
scene.add(car);

function addPart(geometry,material,x,y,z,cast=true){
 const mesh=new THREE.Mesh(geometry,material);
 mesh.position.set(x,y,z);
 mesh.castShadow=cast;
 mesh.receiveShadow=true;
 car.add(mesh);
 return mesh;
}

// Main body and lower chassis
addPart(new THREE.BoxGeometry(1.95,.48,3.9),red,0,.83,0);
addPart(new THREE.BoxGeometry(1.82,.23,3.35),redDark,0,.62,0);
addPart(new THREE.BoxGeometry(1.85,.18,1.05),red,0,1.02,1.25);

// Cabin and windows
addPart(new THREE.BoxGeometry(1.47,.67,1.9),red,0,1.36,-.3);
addPart(new THREE.BoxGeometry(1.32,.49,.045),glass,0,1.43,.68);
addPart(new THREE.BoxGeometry(1.3,.45,.045),glass,0,1.43,-1.28);
addPart(new THREE.BoxGeometry(.045,.42,.78),glass,-.746,1.39,-.3);
addPart(new THREE.BoxGeometry(.045,.42,.78),glass,.746,1.39,-.3);

// Roof
addPart(new THREE.BoxGeometry(1.34,.12,1.18),red,0,1.72,-.28);

// Front grille and bumpers
addPart(new THREE.BoxGeometry(.72,.18,.07),dark,0,.69,1.97);
addPart(new THREE.BoxGeometry(1.85,.16,.14),chrome,0,.61,1.96);
addPart(new THREE.BoxGeometry(1.85,.16,.14),dark,0,.61,-1.97);

// Headlights and rear lights
for(const x of [-.67,.67]){
 addPart(new THREE.BoxGeometry(.39,.15,.08),lampMat,x,.91,1.99);
 addPart(new THREE.BoxGeometry(.36,.14,.08),tailMat,x,.91,-1.99);
}

// Mirrors
for(const x of [-1,1]){
 addPart(new THREE.BoxGeometry(.2,.12,.25),red,x*1.02,1.28,.35);
}

// Wheels, rims and visible spokes
const wheels=[];
for(const x of [-1,1]){
 for(const z of [-1.28,1.28]){
  const wheelGroup=new THREE.Group();
  wheelGroup.position.set(x*.98,.48,z);
  car.add(wheelGroup);

  const tyre=new THREE.Mesh(
   new THREE.CylinderGeometry(.39,.39,.25,24),rubber
  );
  tyre.rotation.z=Math.PI/2;
  tyre.castShadow=true;
  wheelGroup.add(tyre);

  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(.23,.23,.265,20),chrome
  );
  rim.rotation.z=Math.PI/2;
  wheelGroup.add(rim);

  const hub=new THREE.Mesh(
   new THREE.CylinderGeometry(.09,.09,.28,16),dark
  );
  hub.rotation.z=Math.PI/2;
  wheelGroup.add(hub);

  for(let i=0;i<5;i++){
   const spoke=new THREE.Mesh(
    new THREE.BoxGeometry(.035,.34,.045),chrome
   );
   spoke.position.y=Math.cos(i*Math.PI*2/5)*.12;
   spoke.position.z=Math.sin(i*Math.PI*2/5)*.12;
   wheelGroup.add(spoke);
  }
  wheels.push(wheelGroup);
 }
}

// Rear-view mirrors, car shadow
const shadow=new THREE.Mesh(
 new THREE.CircleGeometry(1.7,24),
 new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.17})
);
shadow.rotation.x=-Math.PI/2;
shadow.scale.set(1,1.7,1);
shadow.position.set(0,.01,0);
car.add(shadow);

car.position.set(0,0,4);

// Controls
let speed=0,carX=0,steer=0;
const keys={left:false,right:false,gas:false,brake:false};

function bind(id,key){
 const el=document.getElementById(id);
 const down=e=>{
  e.preventDefault();
  keys[key]=true;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
 };
 const up=e=>{
  e.preventDefault();
  keys[key]=false;
 };
 el.addEventListener('pointerdown',down);
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
 el.addEventListener('lostpointercapture',()=>keys[key]=false);
 el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind('left','left');
bind('right','right');
bind('gas','gas');
bind('brake','brake');

function resetKeys(){
 for(const k in keys)keys[k]=false;
}
addEventListener('blur',resetKeys);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)resetKeys();
});

addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
 if(['arrowleft','a'].includes(k))keys.left=true;
 if(['arrowright','d'].includes(k))keys.right=true;
 if(['arrowup','w'].includes(k))keys.gas=true;
 if(['arrowdown','s'].includes(k))keys.brake=true;
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(['arrowleft','a'].includes(k))keys.left=false;
 if(['arrowright','d'].includes(k))keys.right=false;
 if(['arrowup','w'].includes(k))keys.gas=false;
 if(['arrowdown','s'].includes(k))keys.brake=false;
});

// Camera starts behind and above the car
camera.position.set(0,5.6,12.5);
camera.lookAt(0,1,-8);

const clock=new THREE.Clock();
let messageTimer=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);

 // Smooth acceleration and braking
 if(keys.gas)speed=Math.min(speed+27*dt,120);
 else speed=Math.max(0,speed-4.5*dt);
 if(keys.brake)speed=Math.max(0,speed-58*dt);

 // Correct steering: left moves left, right moves right
 steer=(keys.right?1:0)-(keys.left?1:0);

 // Steering gets stronger as speed rises, but remains controllable
 const steeringPower=.8+Math.min(speed/75,1)*.65;
 carX+=steer*steeringPower*dt*(.9+speed*.026);
 carX=Math.max(-5.0,Math.min(5.0,carX));

 car.position.x=THREE.MathUtils.damp(car.position.x,carX,10,dt);

 // Gentle body lean while turning
 car.rotation.z=THREE.MathUtils.damp(
  car.rotation.z,-steer*.055*Math.min(speed/45,1),7,dt
 );

 // Rotate wheels as the car drives
 for(const wheel of wheels){
  wheel.rotation.x-=speed*dt*.045;
 }

 // Recycle road segments individually so there is no gap
 const movement=speed*dt*.72;
 for(const segment of roadSegments){
  segment.position.z+=movement;
  if(segment.position.z>segmentLength/2){
   segment.position.z-=totalRoadLength;
  }
 }

 // Recycle roadside objects
 for(const t of trees){
  t.position.z+=movement;
  if(t.position.z>15)t.position.z-=totalRoadLength;
 }

 // Camera follows the car smoothly
 const desiredCamera=new THREE.Vector3(
  car.position.x*.42,5.7,12.5
 );
 camera.position.lerp(desiredCamera,1-Math.exp(-3.2*dt));
 camera.lookAt(car.position.x*.25,.9,-9);

 document.getElementById('speed').textContent=Math.round(speed)+' km/t';

 if(speed>5){
  document.getElementById('message').style.opacity='0';
 }else{
  document.getElementById('message').style.opacity='1';
 }

 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});

loading.style.display='none';
animate();
})();
</script>
</body>
</html>
